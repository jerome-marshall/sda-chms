name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # The gate lives in vite.config.ts as the verify:ci task. This job calls it
  # once so the local command and CI cannot drift.
  test:
    runs-on: ubuntu-latest
    env:
      # Job level, because the task runner may not inherit step-level env.
      BASE_REF: origin/${{ github.base_ref || 'main' }}
      ALLOW_TEST_DELETION: ${{ contains(github.event.pull_request.labels.*.name, 'test-deleted') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The test-integrity check compares against the PR base.
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Verify
        run: pnpm verify

  # End-to-end tests against the built worker on local D1. This is the proof
  # that pages render and hydrate, so it runs on PRs as well as main.
  #
  # The Playwright image already carries the browser and its system libraries,
  # so the job never runs apt against the Ubuntu archive. A runner that loses
  # DNS then cannot fail the job before a test starts.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Run E2E tests
        run: vp run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
