name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Type-check + unit/integration tests. PGlite is in-process, so no DB service.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Write apps/web/.env
        run: printf 'DATABASE_URL=%s\n' "postgresql://postgres:postgres@localhost:55432/sda_chms_ci" > apps/web/.env

      - name: Void codegen
        run: pnpm --dir apps/web exec void prepare

      - name: Type-check
        run: vp run check-types

      - name: Static check (lint + format + types)
        run: vp check

      - name: Drift gate (schema must match committed migrations)
        run: |
          pnpm --dir apps/web exec void db generate
          git diff --exit-code -- apps/web/db

      - name: Unit + integration tests
        run: vp test run

  # End-to-end tests against the real stack + a throwaway Postgres.
  # Heavier (real Postgres + browser), so run only on pushes to main — not on
  # every PR. PRs get the fast `test` job; the migration PR itself is proven
  # with a local `pnpm test:e2e` before landing (see its trail).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sda_chms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sda_chms_test
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Write apps/web/.env
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > apps/web/.env

      - name: Void codegen
        run: pnpm --dir apps/web exec void prepare

      - name: Apply migrations
        run: pnpm --dir apps/web exec void db migrate

      - name: Seed throwaway database
        run: SEED_COUNT=20 pnpm --dir apps/web exec void db seed --yes

      - name: Production build
        run: pnpm --dir apps/web run build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: vp run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
