name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Type-check + unit/integration tests. The D1 test harness is in-process, so no DB service.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Void codegen
        run: pnpm --dir apps/chms exec void prepare

      - name: Type-check
        run: vp run check-types

      - name: Static check (lint + format + types)
        run: vp check

      - name: Drift gate (schema must match committed migrations)
        run: |
          pnpm --dir apps/chms exec void db generate
          git diff --exit-code -- apps/chms/db

      - name: Unit + integration tests
        run: vp test run

  # End-to-end tests against the built worker on local D1. Heavier (browser),
  # so run only on pushes to main — not on every PR. PRs get the fast `test` job.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Void codegen
        run: pnpm --dir apps/chms exec void prepare

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: vp run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
