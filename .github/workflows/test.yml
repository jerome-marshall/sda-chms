name: test

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  # Type-check + unit/integration tests. PGlite is in-process, so no DB service.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Type-check
        run: vp run check-types

      - name: Static check (lint + format + types)
        run: vp check

      - name: Unit + integration tests
        run: vp run test

  # End-to-end tests against the real stack + a throwaway Postgres.
  # Heavier (real Postgres + browser), so run only on pushes to main — not on
  # every PR. PRs get the fast `test` job; AFK agents run `pnpm test:e2e`
  # locally before pushing. (`push` only fires on main per the trigger above.)
  e2e:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sda_chms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sda_chms_test
      CORS_ORIGIN: http://localhost:3001
      VITE_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: true

      - name: Apply schema to Postgres
        run: vp -C packages/db run db:apply-schema

      - name: Seed minimal data
        run: vp -C packages/db run db:seed 20

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: vp run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
