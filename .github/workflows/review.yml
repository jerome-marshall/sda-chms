name: review

on:
  pull_request:

concurrency:
  group: review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check for the review key
        id: key
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
        run: |
          if [ -n "$REVIEW_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip without the key
        if: steps.key.outputs.present == 'false' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "Automated review skipped: the REVIEW_API_KEY secret is not set. A human review still needs to run the list in docs/agents/reviewer.md."

      - name: Review the diff
        if: steps.key.outputs.present == 'true'
        env:
          REVIEW_API_KEY: ${{ secrets.REVIEW_API_KEY }}
          REVIEW_BASE_URL: ${{ vars.REVIEW_BASE_URL || secrets.REVIEW_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || secrets.REVIEW_MODEL }}
          BASE_REF: origin/${{ github.base_ref || 'main' }}
        run: |
          # Run the script from the base ref so a PR cannot rewrite the
          # reviewer that holds the key. The first PR that adds this workflow
          # has no base copy yet and falls back to the checkout.
          BASE_SCRIPT=/tmp/review-diff.mjs
          GUIDE=/tmp/reviewer-list.md
          if git show "$BASE_REF:scripts/review-diff.mjs" > "$BASE_SCRIPT" 2>/dev/null; then
            SCRIPT="$BASE_SCRIPT"
          else
            SCRIPT="scripts/review-diff.mjs"
          fi
          git show "$BASE_REF:docs/agents/reviewer.md" > "$GUIDE" 2>/dev/null || GUIDE="docs/agents/reviewer.md"
          set +e
          REVIEW_GUIDE="$GUIDE" node "$SCRIPT" > review-comment.md 2>&1
          status=$?
          set -e
          cat review-comment.md
          exit $status

      - name: Post the review
        if: always() && steps.key.outputs.present == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR" --body-file review-comment.md
